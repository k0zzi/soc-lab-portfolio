title: Share And Session Enumeration Using Net.EXE
id: 62510e69-616b-4078-b371-847da438cc03
status: stable
description: Detects attempts to enumerate file shares, printer shares and sessions using "net.exe" with the "view" flag.
references:
    - https://eqllib.readthedocs.io/en/latest/analytics/b8a94d2f-dc75-4630-9d73-1edc6bd26fff.html
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1018/T1018.md
author: Endgame, JHasenbusch (ported for oscd.community)
date: 2018-10-30
modified: 2023-02-21
tags:
    - attack.discovery
    - attack.t1018
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\net.exe'
              - '\net1.exe'
        - OriginalFileName:
              - 'net.exe'
              - 'net1.exe'
    selection_cli:
        CommandLine|contains: 'view'
    filter:
        CommandLine|contains: '\\\\'
    condition: all of selection_* and not filter
falsepositives:
    - Legitimate use of net.exe utility by legitimate user
level: low

# --- Lab validation note (this repo) ---
# Ported unmodified from SigmaHQ (rule content verified current as of this
# commit — no changes since the 2023-02-21 revision above). Converted to a
# Wazuh local rule (id 100190, level 6) and validated live against Atomic
# Red Team T1018 Test #1 ("Remote System Discovery - net") on CLT601 —
# both `net view /domain` and `net view` fired correctly, confirmed via
# before/after Wazuh alert comparison. See docs/findings/T1018-T1087.002.md
# for the full test methodology, source cross-validation, and results.
