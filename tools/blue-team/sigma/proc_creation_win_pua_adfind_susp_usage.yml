status: test
description: Detects AdFind execution with common flags seen used during attacks
references:
    - https://www.joeware.net/freetools/tools/adfind/
    - https://thedfirreport.com/2020/05/08/adfind-recon/
    - https://thedfirreport.com/2021/01/11/trickbot-still-alive-and-well/
    - https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
    - https://social.technet.microsoft.com/wiki/contents/articles/7535.adfind-command-examples.aspx
    - https://github.com/center-for-threat-informed-defense/adversary_emulation_library/blob/bf62ece1c679b07b5fb49c4bae947fe24c81811f/fin6/Emulation_Plan/Phase1.md
    - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1087.002/T1087.002.md#atomic-test-7---adfind---enumerate-active-directory-user-objects
author: Janantha Marasinghe (https://github.com/blueteam0ps), FPT.EagleEye Team, omkar72, oscd.community
date: 2021-02-02
modified: 2025-10-24
tags:
    - attack.discovery
    - attack.t1018
    - attack.t1087.002
    - attack.t1482
    - attack.t1069.002
    - stp.1u
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'domainlist'
            - 'trustdmp'
            - 'dcmodes'
            - 'adinfo'
            - '-sc dclist'
            - 'computer_pwdnotreqd'
            - 'objectcategory='
            - '-subnets -f'
            - 'name="Domain Admins"'
            - '-sc u:'
            - 'domainncs'
            - 'dompol'
            - ' oudmp '
            - 'subnetdmp'
            - 'gpodmp'
            - 'fspdmp'
            - 'users_noexpire'
            - 'computers_active'
            - 'computers_pwdnotreqd'
    condition: selection
falsepositives:
    - Legitimate admin activity
level: high

# --- Lab validation note (this repo) ---
# Ported unmodified from SigmaHQ (rule content verified current as of this
# commit — last upstream revision 2025-10-24, no changes since). Converted
# to a Wazuh local rule (id 100200, level 12, mail:true) and validated live
# against Atomic Red Team T1087.002 Test #7 ("Adfind - Enumerate Active
# Directory User Objects") on CLT601 — AdFind's `-f (objectcategory=person)`
# invocation against the domain controller fired correctly, confirmed via
# before/after Wazuh alert comparison (the same commandline previously
# produced only indirect/mistagged default-rule alerts). Severity was
# cross-checked against Elastic's and Splunk's own official AdFind
# detection content; see docs/findings/T1018-T1087.002.md for the full
# methodology, false-positive calibration discussion, and results.
#
# A complementary, name/imphash-based SigmaHQ rule also exists —
# proc_creation_win_pua_adfind_execution.yml (id 514e7e3e-b3b4-4a67-af60-
# be20f139198b, Nextron Systems, 2025-02-26) — which would catch AdFind
# regardless of which flags are used, at the cost of the same broader
# false-positive profile Elastic's equivalent name-only rule carries (see
# docs/findings/T1018-T1087.002.md). Not deployed here; noted as a ready,
# sourced option for a future coverage layer.
